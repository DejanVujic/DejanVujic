<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="370" viewBox="0 0 1000 370">
  <title>The person behind the code — Dejan Vujic</title>
  <desc>
    From precision engineering to fullstack development.
    Industrial mechanic, certified master craftsman with instructor
    qualification, and fullstack developer in training at Developer Akademie.
    Currently learning HTML, CSS, JavaScript and Python.
  </desc>

  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0d1117"/>
      <stop offset="1" stop-color="#193c52"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="368"
        rx="24" fill="url(#background)" stroke="#315365"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="40" y="40" fill="#63d8eb"
          font-size="12" letter-spacing="2">
      CRAFTSMANSHIP · CURIOSITY · CODE
    </text>

    <text x="40" y="83" fill="#f0f6fc"
          font-size="30" font-weight="700">
      The person behind the code
    </text>

    <g fill="#bfd1de" font-size="18">
      <text x="40" y="123">
        I'm Dejan — a master craftsman bringing precision and
      </text>
      <text x="40" y="150">
        a problem-solving mindset into fullstack development.
      </text>
    </g>

    <path d="M65 213H920" stroke="#315365" stroke-width="2"/>

    <g fill="#42cfe5">
      <circle cx="65" cy="213" r="7"/>
      <circle cx="370" cy="213" r="7"/>
      <circle cx="680" cy="213" r="7"/>
    </g>

    <g fill="#edf5fa" font-size="19" font-weight="600">
      <text x="40" y="250">Precision Engineering</text>
      <text x="345" y="250">Master Craftsman</text>
      <text x="655" y="250">Fullstack Development</text>
    </g>

    <g fill="#9fbccc" font-size="15">
      <text x="40" y="278">Industrial mechanic</text>
      <text x="345" y="278">Handwerksmeister · AdA</text>
      <text x="655" y="278">Trainee · Developer Akademie</text>
    </g>

    <path d="M40 305H960" stroke="#315365"/>

    <text x="40" y="340" fill="#63d8eb"
          font-size="12" letter-spacing="1.5">
      CURRENTLY LEARNING
    </text>
    <text x="260" y="340" fill="#edf5fa" font-size="17">
      HTML · CSS · JavaScript · Python
    </text>
  </g>
</svg>
